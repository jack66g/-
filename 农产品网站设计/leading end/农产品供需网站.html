<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农产品供需平台 - 登录</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --bg: #f0f7f0;
            --card-bg: #ffffff;
            --text: #333;
            --text-light: #888;
            --border: #e0e0e0;
            --danger: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(76,175,80,0.3);
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 22px;
            color: var(--primary-dark);
            font-weight: 600;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 13px;
            color: #66bb6a;
            margin-top: 4px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px 36px;
            width: 400px;
            max-width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .card h2 {
            text-align: center;
            font-size: 20px;
            color: var(--text);
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
            background: #fafafa;
        }
        .form-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }
        .forgot-link {
            text-align: right;
            margin-top: 4px;
        }
        .forgot-link a {
            color: var(--text-light);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }
        .forgot-link a:hover { color: var(--primary); }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(76,175,80,0.4);
        }
        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: #e8f5e9;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999;
            animation: slideDown 0.4s ease;
            display: none;
        }
        .toast.error { background: #fdecea; color: #c62828; border: 1px solid #ef9a9a; display: block; }
        .toast.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; display: block; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="001.jpg" alt="logo" class="logo">
        <h1>🌾 宁波城乡农产品供需营销平台</h1>
        <p>新鲜 · 健康 · 直达</p>
    </div>

    <div class="card">
        <h2>用户登录</h2>
        <div id="toast" class="toast"></div>

        <div class="form-group">
            <label>手机号</label>
            <input type="text" id="username" placeholder="请输入11位手机号" maxlength="11">
        </div>

        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
            <div class="forgot-link">
                <a href="忘记密码界面.html">忘记密码？</a>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="loginBtn">登 录</button>
            <a href="注册界面.html" class="btn btn-outline">注 册</a>
        </div>
    </div>

    <p class="footer-text">宁波城乡农产品供需营销平台 © 2025</p>

    <script>
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const phone = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!phone || !password) {
                showToast('请输入手机号和密码', 'error');
                return;
            }

            try {
                const resp = await fetch('http://localhost:3002/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: phone, password })
                });
                const result = await resp.json();

                if (result.success) {
                    showToast('登录成功，正在跳转...', 'success');
                    localStorage.setItem('user', JSON.stringify({ phone, id: result.user?.id }));
                    setTimeout(() => window.location.href = 'Main.html', 800);
                } else {
                    const errMsg = Array.isArray(result.errors) ? result.errors.join('；') : (result.message || '登录失败');
                    showToast(errMsg, 'error');
                }
            } catch (err) {
                showToast('网络连接异常，请确认服务已启动', 'error');
            }
        });

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
    </script>
</body>
</html>

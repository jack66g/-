<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录 - 农产品供需平台</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --bg: #f0f7f0;
            --text: #333;
            --text-light: #888;
            --border: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 36px;
            width: 400px;
            max-width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .card h2 { text-align: center; font-size: 22px; color: var(--text); margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; color: #555; margin-bottom: 5px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 12px 14px; border: 2px solid var(--border);
            border-radius: 10px; font-size: 15px; transition: all 0.3s; outline: none; background: #fafafa;
        }
        .form-group input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(76,175,80,0.1); }
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 10px;
            font-size: 16px; cursor: pointer; font-weight: 600; transition: all 0.3s; margin-top: 8px;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(76,175,80,0.4); }
        .back-link { text-align: center; margin-top: 16px; font-size: 13px; }
        .back-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .toast {
            padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px;
            display: none; animation: fadeIn 0.3s ease; text-align: center;
        }
        .toast.error { background: #fdecea; color: #c62828; border: 1px solid #ef9a9a; display: block; }
        .toast.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 管理后台登录</h2>
        <div id="toast" class="toast"></div>
        <div class="form-group">
            <label>管理员账号</label>
            <input type="text" id="username" placeholder="请输入管理员账号">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button class="btn btn-primary" id="loginBtn">管理员登录</button>
        <div class="back-link"><a href="农产品供需网站.html">← 返回用户登录</a></div>
    </div>

    <script>
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
        }
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) return showToast('请输入账号和密码', 'error');
            try {
                const resp = await fetch('http://localhost:3005/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await resp.json();
                if (result.success) {
                    showToast('登录成功，正在跳转...', 'success');
                    setTimeout(() => window.location.href = '后台.html', 800);
                } else {
                    const errs = Array.isArray(result.errors) ? result.errors.join('；') : '用户名或密码错误';
                    showToast(errs, 'error');
                }
            } catch (err) {
                showToast('网络连接异常，请确认服务已启动', 'error');
            }
        });
    </script>
</body>
</html>
